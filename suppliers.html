<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Постачальники | Склад ТОВ «Меблеві Технології Етера»</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>ТОВ «Меблеві Технології Етера»</h2>
            <h3>Склад Фурнітури</h3>
            <nav id="main-navigation"></nav>
        </aside>

        <main class="main-content">
            <header>
                <div class="header-title">
                    <h1>Контрагенти та постачальники</h1>
                    <p class="subtitle">Управління контактними даними партнерів для замовлення фурнітури</p>
                </div>
                <div class="user-profile" id="user-display">Завантаження профілю...</div>
            </header>

            <div class="inventory-grid">
                <div class="content-card dynamic-form">
                    <h2>Додати постачальника</h2>
                    <form id="add-supplier-form">
                        <div class="form-group">
                            <label for="s-name">Назва компанії / ПІБ</label>
                            <input type="text" id="s-name" placeholder="Напр., ТОВ МебельКомплект" required>
                        </div>
                        <div class="form-group">
                            <label for="s-phone">Контактний телефон</label>
                            <input type="tel" id="s-phone" placeholder="Напр., +380671234567" required>
                        </div>
                        <div class="form-group">
                            <label for="s-email">Email</label>
                            <input type="email" id="s-email" placeholder="Напр., info@supplier.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Реєстрація постачальника</button>
                    </form>
                </div>

                <div class="content-card inventory-list">
                    <h2>Зареєстровані постачальники</h2>
                    <table class="data-table" id="suppliers-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Назва компанії</th>
                                <th>Телефон</th>
                                <th>Email</th>
                                <th>Дії</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
